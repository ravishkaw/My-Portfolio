<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: stash the requested deep link, then hand
      // control to index.html, which restores it via history.replaceState.
      sessionStorage.redirect = location.href;
      location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
